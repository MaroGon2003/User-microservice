services:
  # ===============================================
  # Microservicio de USUARIOS (user-microservice)
  # Este es el microservicio donde se encuentra este docker-compose.yml
  # ===============================================
  user-micro-image:
    image: user-micro-image
    container_name: user-micro-container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
        - spring-network
    depends_on:
      - mysql_users

  # ===============================================
  # Base de Datos para USUARIOS (mysql_users)
  # ===============================================
  mysql_users:
    image: mysql
    container_name: mysql_users_db
    ports:
      - "3307:3306"
    networks:
      - spring-network
    volumes:
      - mysql_users_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: Pandequeso123
      MYSQL_DATABASE: users_db
      MYSQL_USER: mao
      MYSQL_PASSWORD: Pandequeso123

  # ===============================================
  # Microservicio de HOUSE (house-microservice)
  # ===============================================
  stock-micro-image:
    build:
      # MUY IMPORTANTE: La ruta relativa desde 'microservicio-usuarios' hasta 'microservicio-productos'
      context: ../house-microservice/
      dockerfile: Dockerfile
    container_name: house-micro-container
    ports:
      - "8020:8020"
    networks:
      - spring-network
    depends_on:
      - mysql_stock

  # ===============================================
  # Base de Datos para stock (mysql_stock)
  # ===============================================
  mysql_stock:
    image: mysql
    container_name: mysql_stock_db
    ports:
      - "3308:3306"
    networks:
      - spring-network
    volumes:
      - mysql_stock_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: Pandequeso123
      MYSQL_DATABASE: stock
      MYSQL_USER: mao
      MYSQL_PASSWORD: Pandequeso123



# ===============================================
# Definición de Redes y Volúmenes
# ===============================================
networks:
  spring-network:

volumes:
  mysql_users_volume:
  mysql_stock_volume:

